name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/github-artifact-hosting-cpra7d]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The workflow token may not create a Pages site, so a repo admin turns
      # Pages on once under Settings > Pages. Until the source is set to
      # "GitHub Actions" there is nothing for this job to deploy to.
      - name: Check how Pages is configured
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo none)
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
          case "$build_type" in
            workflow)
              echo "Pages source is GitHub Actions - deploying." >> "$GITHUB_STEP_SUMMARY" ;;
            legacy)
              echo "Pages serves a branch directly, so this workflow has nothing to do." >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "Pages is not enabled. Enable it under Settings > Pages (source: GitHub Actions), then re-run this workflow." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - if: steps.check.outputs.build_type == 'workflow'
        name: Stage the site
        run: |
          mkdir -p _site
          cp index.html run-video.mp4 .nojekyll _site/

      - if: steps.check.outputs.build_type == 'workflow'
        uses: actions/configure-pages@v5

      - if: steps.check.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v3

      - if: steps.check.outputs.build_type == 'workflow'
        id: deployment
        uses: actions/deploy-pages@v4
